services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    restart: unless-stopped
    # -filer and -s3.config added: without a config file, the S3 gateway
    # has no identities configured, so the access/secret keys the api
    # service sends are never actually checked against anything.
    command: >
      server
      -dir=/data
      -filer
      -s3
      -s3.port=8333
      -s3.config=/etc/seaweedfs/s3_config.json
    volumes:
      - seaweed_data:/data
      - ./seaweedfs/s3_config.json:/etc/seaweedfs/s3_config.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8333 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "8333:8333"

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      S3_ENDPOINT_URL: http://seaweedfs:8333
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
    ports:
      - "8000:8000"

volumes:
  db_data:
  seaweed_data: